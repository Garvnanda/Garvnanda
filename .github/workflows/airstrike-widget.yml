name: Update airstrike widget

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate airstrike.svg
        run: node scripts/generate-airstrike-svg.mjs
        env:
          GH_USERNAME: Garvnanda
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/airstrike.svg
          git diff --cached --quiet || git commit -m "chore: refresh airstrike widget"
          git push
