name: Update 3D contribution calendar

on:
  # Midnight UTC is the single most contended minute on GitHub's scheduler; this
  # daily run is far more likely to actually fire an hour later at an odd minute.
  schedule:
    - cron: "19 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Per-workflow only — see the note in chess-widget.yml for why these six do not
# share one concurrency group.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Garvnanda

      - name: Post-process gitblock (transparent bg, white text, strip footer counters, heartbeat)
        run: |
          F=profile-3d-contrib/profile-gitblock.svg
          # transparent background
          sed -i 's/<rect x="0" y="0" width="1280" height="850" fill="#ffffff"><\/rect>/<rect x="0" y="0" width="1280" height="850" fill="none"><\/rect>/' "$F"
          # dark text/icons -> white, so it's visible on the now-transparent background
          sed -i 's/fill="#00000f"/fill="#ffffff"/g; s/fill="#111133"/fill="#ffffff"/g; s/fill="gray"/fill="#ffffff"/g' "$F"
          # strip the action's own contributions/stars/forked footer row (redundant with the
          # GitHub Stats panel above, and computed differently so the numbers didn't match it)
          perl -0777 -pi -e 's/<text style="font-size: 32px; font-weight: bold;" x="384".*?(?=<text style="font-size: 16px;" x="1260")//s' "$F"
          # daily heartbeat so the workflow always has a diff to commit, even with 0 new contributions
          sed -i 's/<!-- heartbeat: [0-9-]*-->//;s/<!-- heartbeat: [0-9-]* -->//' "$F"
          sed -i "s/<\/defs>/<\/defs><!-- heartbeat: $(date -u +%F) -->/" "$F"

      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          # Bot on purpose: GitHub does not count github-actions[bot] toward the
          # contribution graph, and these ~16 commits a day are automation, not work.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh 3D contribution calendar"
          for i in $(seq 1 10); do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            # A conflicting pull leaves a rebase in progress; without this every
            # later attempt fails instantly on the half-finished state.
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          echo "::error::push to main failed after 10 attempts"
          exit 1
