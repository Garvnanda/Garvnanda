name: Update GitHub stats widget

on:
  # Staggered off ":00" and off the other two 6-hourly widgets so they do not all
  # wake up, hit the API and race to push to main in the same minute.
  schedule:
    - cron: "26 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Per-workflow only — see the note in chess-widget.yml for why these six do not
# share one concurrency group.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate github-stats.svg
        run: node scripts/generate-github-stats-svg.mjs
        env:
          GH_USERNAME: Garvnanda
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add assets/github-stats.svg assets/dark/github-stats.svg
          git diff --cached --quiet && exit 0
          AUTHOR="$(bash scripts/pick-author.sh)"
          git config user.name "${AUTHOR%%|*}"
          git config user.email "${AUTHOR##*|}"
          git commit -m "chore: refresh github stats widget"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            # A conflicting pull leaves a rebase in progress; without this every
            # later attempt fails instantly on the half-finished state.
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 1))
          done
          echo "::error::push to main failed after 5 attempts"
          exit 1
