name: Update chess panel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [chess-move]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate chess panel
        run: node scripts/generate-chess-panel.mjs
        env:
          WORKER_URL: https://garvnanda-profile.garvnanda.workers.dev

      - name: Commit if changed
        run: |
          git config user.name "Garvnanda"
          git config user.email "184491525+Garvnanda@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh chess panel"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep $((RANDOM % 10 + 1))
          done
