name: Update chess panel

on:
  # Off-the-hour minutes: GitHub drops scheduled runs under load, and ":00" plus
  # very short intervals are the first to go. "*/5" was being delivered ~12x/day.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [chess-move]

permissions:
  contents: write

# Keeps a scheduled tick from overlapping a still-running dispatch of this same
# workflow. Deliberately per-workflow, not one group shared across all six: a
# shared group holds only one pending run, so simultaneous widget workflows would
# cancel each other and silently skip updates. Cross-workflow pushes are
# serialised by the pull --rebase retry loop below instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate chess panel
        run: node scripts/generate-chess-panel.mjs
        env:
          WORKER_URL: https://garvnanda-profile.garvnanda.workers.dev

      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add README.md
          git diff --cached --quiet && exit 0
          # Bot on purpose: GitHub does not count github-actions[bot] toward the
          # contribution graph, and these ~16 commits a day are automation, not work.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh chess panel"
          for i in $(seq 1 10); do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            # A conflicting pull leaves a rebase in progress; without this every
            # later attempt fails instantly on the half-finished state.
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          echo "::error::push to main failed after 10 attempts"
          exit 1
