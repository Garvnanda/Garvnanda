name: Update commits widget

on:
  # Off-the-hour minute: ":00" is the most contended slot on GitHub's scheduler,
  # and hourly runs at :00 were being delivered ~11x/day instead of 24.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Per-workflow only — see the note in chess-widget.yml for why these six do not
# share one concurrency group.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate commits.svg
        run: node scripts/generate-commits-svg.mjs
        env:
          GH_USERNAME: Garvnanda
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add assets/commits.svg assets/dark/commits.svg
          git diff --cached --quiet && exit 0
          # Bot on purpose: GitHub does not count github-actions[bot] toward the
          # contribution graph, and these ~16 commits a day are automation, not work.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh commits widget"
          for i in $(seq 1 10); do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            # A conflicting pull leaves a rebase in progress; without this every
            # later attempt fails instantly on the half-finished state.
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          echo "::error::push to main failed after 10 attempts"
          exit 1
