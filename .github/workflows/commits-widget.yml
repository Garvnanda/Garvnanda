name: Update commits widget

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate commits.svg
        run: node scripts/generate-commits-svg.mjs
        env:
          GH_USERNAME: Garvnanda
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/commits.svg assets/dark/commits.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh commits widget"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep $((RANDOM % 10 + 1))
          done
