name: Update ecosystem tree

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate tree.svg
        run: node scripts/generate-tree-svg.mjs
        env:
          GH_USERNAME: Garvnanda
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tree.svg assets/dark/tree.svg
          git diff --cached --quiet || git commit -m "chore: refresh ecosystem tree"
          git push
