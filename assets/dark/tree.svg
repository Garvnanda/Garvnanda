<svg viewBox="0 0 1000 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live ecosystem tree: me at the center, wired out to my 6 most active repos">
  <style>
    :root { --bone: #FFFFFF; --muted: #FFFFFF; --dim: #FFFFFF; --rule: #FFFFFF; --node-bg: #0D1117; --core-bg: #0D1117; --accent: #FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .node { fill: var(--node-bg); stroke: var(--rule); stroke-width: 1; }
    .core { fill: var(--core-bg); stroke: var(--rule); stroke-width: 1.5; }
    .wire { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .w1{animation-delay:.2s}.w2{animation-delay:.32s}.w3{animation-delay:.44s}.w4{animation-delay:.56s}.w5{animation-delay:.68s}.w6{animation-delay:.8s}
    .flow { stroke: var(--muted); stroke-width: 1; opacity: .25; stroke-dasharray: 3 9; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .p0{animation-delay:.1s}.p1{animation-delay:.9s}.p2{animation-delay:1.0s}.p3{animation-delay:1.1s}.p4{animation-delay:1.2s}.p5{animation-delay:1.3s}.p6{animation-delay:1.4s}
    .breathe { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.55} }
    @media (prefers-reduced-motion: reduce) {
      .wire,.flow,.pop,.breathe { animation: none; }
      .wire{stroke-dashoffset:0} .pop{opacity:1} .flow{opacity:.12}
    }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="13" letter-spacing="3">LIVE ECOSYSTEM TREE — 6 MOST RECENTLY SHIPPED REPOS</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="13" letter-spacing="3" text-anchor="end">FIG. 01</text>

  <g>
    <line class="wire w1" x1="500" y1="310" x2="155" y2="117"/>
    <line class="wire w2" x1="500" y1="310" x2="845" y2="117"/>
    <line class="wire w3" x1="500" y1="310" x2="115" y2="310"/>
    <line class="wire w4" x1="500" y1="310" x2="885" y2="310"/>
    <line class="wire w5" x1="500" y1="310" x2="235" y2="503"/>
    <line class="wire w6" x1="500" y1="310" x2="765" y2="503"/>
  </g>
  <g>
    <line class="flow" x1="500" y1="310" x2="155" y2="117"/>
    <line class="flow" x1="500" y1="310" x2="845" y2="117"/>
    <line class="flow" x1="500" y1="310" x2="115" y2="310"/>
    <line class="flow" x1="500" y1="310" x2="885" y2="310"/>
    <line class="flow" x1="500" y1="310" x2="235" y2="503"/>
    <line class="flow" x1="500" y1="310" x2="765" y2="503"/>
  </g>

  <g class="pop p0 breathe">
    <rect class="core" x="405" y="282" width="190" height="56" rx="4"/>
    <text fill="var(--bone)" class="mono" x="500" y="306" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle">ME</text>
    <text fill="var(--accent)" class="mono" x="500" y="324" font-size="10" letter-spacing="1" text-anchor="middle">@Garvnanda</text>
  </g>

  <g class="pop p1">
      <rect class="node" x="60" y="90" width="190" height="54" rx="2"/>
      <text fill="var(--bone)" class="mono" x="155" y="113" font-size="14" letter-spacing="1" text-anchor="middle">AUTOMATE-INDIA</text>
      <text fill="var(--muted)" class="mono" x="155" y="132" font-size="10.5" letter-spacing="1" text-anchor="middle">Python · repo</text>
    </g>
    <g class="pop p2">
      <rect class="node" x="750" y="90" width="190" height="54" rx="2"/>
      <text fill="var(--bone)" class="mono" x="845" y="113" font-size="14" letter-spacing="1" text-anchor="middle">ORCHESTRATE-AUG26</text>
      <text fill="var(--muted)" class="mono" x="845" y="132" font-size="10.5" letter-spacing="1" text-anchor="middle">Python · repo</text>
    </g>
    <g class="pop p3">
      <rect class="node" x="20" y="283" width="190" height="54" rx="2"/>
      <text fill="var(--bone)" class="mono" x="115" y="306" font-size="14" letter-spacing="1" text-anchor="middle">SANN</text>
      <text fill="var(--muted)" class="mono" x="115" y="325" font-size="10.5" letter-spacing="1" text-anchor="middle">Python · repo</text>
    </g>
    <g class="pop p4">
      <rect class="node" x="790" y="283" width="190" height="54" rx="2"/>
      <text fill="var(--bone)" class="mono" x="885" y="306" font-size="14" letter-spacing="1" text-anchor="middle">MULTI-FOLIO-MAKER</text>
      <text fill="var(--muted)" class="mono" x="885" y="325" font-size="10.5" letter-spacing="1" text-anchor="middle">TypeScript · repo</text>
    </g>
    <g class="pop p5">
      <rect class="node" x="140" y="476" width="190" height="54" rx="2"/>
      <text fill="var(--bone)" class="mono" x="235" y="499" font-size="14" letter-spacing="1" text-anchor="middle">NEWS-CATEGORIZER</text>
      <text fill="var(--muted)" class="mono" x="235" y="518" font-size="10.5" letter-spacing="1" text-anchor="middle">Python · repo</text>
    </g>
    <g class="pop p6">
      <rect class="node" x="670" y="476" width="190" height="54" rx="2"/>
      <text fill="var(--bone)" class="mono" x="765" y="499" font-size="14" letter-spacing="1" text-anchor="middle">DATATHON-2026</text>
      <text fill="var(--muted)" class="mono" x="765" y="518" font-size="10.5" letter-spacing="1" text-anchor="middle">Python · repo</text>
    </g>

  <line x1="48" y1="590" x2="952" y2="590" stroke="var(--rule)"/>
  <text fill="var(--dim)" class="mono" x="952" y="612" font-size="12" letter-spacing="2" text-anchor="end">DASHED LINES — DATA IN MOTION</text>
</svg>
