<svg viewBox="0 0 1000 330" width="1000" height="330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages, AI/ML, backend and cloud, Web3, frontend, tooling">
  <style>
    :root { --bone: #333333; --rule: #E1E4E8; --muted: #888888; --accent: #555555; --panel: #F8F9FA; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #333333; --muted: #777777; --accent: #AAAAAA; --panel: #161616; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a0{animation-delay:0s} .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    :root { --bone: #FFFFFF; --rule: #FFFFFF; --muted: #FFFFFF; --accent: #FFFFFF; --panel: #0D1117; }
  </style>

  <rect x="24" y="8" width="952" height="314" rx="10" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5" class="rise a0"/>
  <line x1="162" y1="30" x2="162" y2="300" stroke="var(--rule)" stroke-width="1" opacity=".7"/>

  <text class="mono rise a1" x="56"  y="52" font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="178" y="52" font-size="14" fill="var(--bone)">Python &#183; C &#183; C++ &#183; Java</text>

  <text class="mono rise a2" x="56"  y="88" font-size="12" fill="var(--muted)" letter-spacing="2">AI / ML</text>
  <text class="mono rise a2" x="178" y="88"  font-size="14" fill="var(--bone)">PyTorch &#183; scikit-learn &#183; RAG &#183; Vector Databases (ChromaDB)</text>
  <text class="mono rise a2" x="178" y="108" font-size="14" fill="var(--bone)">LLM Fine-Tuning &#183; Multi-Agent Systems &#183; Reinforcement Learning &#183; NLP</text>
  <text class="mono rise a2" x="178" y="128" font-size="14" fill="var(--bone)">Prompt Engineering &#183; AI Agent Governance &amp; Safety</text>

  <text class="mono rise a3" x="56"  y="164" font-size="12" fill="var(--muted)" letter-spacing="2">BACKEND</text>
  <text class="mono rise a3" x="178" y="164" font-size="14" fill="var(--bone)">FastAPI &#183; Streamlit &#183; Supabase/PostgreSQL &#183; AWS &#183; Zoho Catalyst</text>
  <text class="mono rise a3" x="178" y="184" font-size="14" fill="var(--bone)">Docker &#183; REST APIs &#183; MCP (Model Context Protocol)</text>

  <text class="mono rise a4" x="56"  y="220" font-size="12" fill="var(--muted)" letter-spacing="2">WEB3</text>
  <text class="mono rise a4" x="178" y="220" font-size="14" fill="var(--bone)">Solidity &#183; Foundry &#183; Aptos &#183; Wallet Integration (Petra, WalletConnect, MetaMask)</text>

  <text class="mono rise a5" x="56"  y="256" font-size="12" fill="var(--muted)" letter-spacing="2">FRONTEND</text>
  <text class="mono rise a5" x="178" y="256" font-size="14" fill="var(--bone)">React &#183; Flutter &#183; Tailwind CSS</text>

  <text class="mono rise a6" x="56"  y="292" font-size="12" fill="var(--muted)" letter-spacing="2">TOOLING</text>
  <text class="mono rise a6" x="178" y="292" font-size="14" fill="var(--muted)">Git &#183; GitHub &#183; OpenRouter &#183; Google Gemini API &#183; Kaggle &#183; Google Colab</text>
</svg>
