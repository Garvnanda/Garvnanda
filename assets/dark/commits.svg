<svg viewBox="0 0 760 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recent commits">
  <!-- heartbeat: 2026-08-14 -->
  <style>
    :root { --win: #0D1117; --bar: #161B22; --bone: #FFFFFF; --dim: #FFFFFF; --accent: #FFFFFF; --rule: #FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .row { opacity: 0; animation: rise .5s ease forwards; }
    @keyframes rise { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } }
  </style>

  <rect x="0" y="0" width="760" height="260" rx="10" fill="var(--win)" stroke="var(--rule)"/>
  <rect x="0" y="0" width="760" height="36" rx="10" fill="var(--bar)"/>
  <rect x="0" y="26" width="760" height="10" fill="var(--bar)"/>
  <circle cx="22" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="18" r="6" fill="#27C93F"/>
  <text class="mono" x="380" y="22" font-size="12" fill="var(--dim)" text-anchor="middle">garv@github — zsh</text>

  <text class="mono" x="24" y="60" font-size="13" fill="var(--accent)">garv@github <tspan fill="var(--dim)">~</tspan> % <tspan fill="var(--bone)">git log --oneline -6</tspan></text>

  <text class="mono row" style="animation-delay:0.00s" x="24" y="92" font-size="13"><tspan fill="var(--accent)">Garvnanda</tspan><tspan fill="var(--dim)"> — </tspan><tspan fill="var(--bone)">Merge pull request #20 from Garvnanda/readme-v2</tspan></text>
  <text class="mono row" style="animation-delay:0.08s" x="24" y="116" font-size="13"><tspan fill="var(--accent)">Garvnanda</tspan><tspan fill="var(--dim)"> — </tspan><tspan fill="var(--bone)">fix: stop attributing automated widget commits to th</tspan></text>
  <text class="mono row" style="animation-delay:0.16s" x="24" y="140" font-size="13"><tspan fill="var(--accent)">Garvnanda</tspan><tspan fill="var(--dim)"> — </tspan><tspan fill="var(--bone)">Merge pull request #19 from Garvnanda/readme-v2</tspan></text>
  <text class="mono row" style="animation-delay:0.24s" x="24" y="164" font-size="13"><tspan fill="var(--accent)">Garvnanda</tspan><tspan fill="var(--dim)"> — </tspan><tspan fill="var(--bone)">fix: stop widget workflows silently failing, spread </tspan></text>
  <text class="mono row" style="animation-delay:0.32s" x="24" y="188" font-size="13"><tspan fill="var(--accent)">Garvnanda</tspan><tspan fill="var(--dim)"> — </tspan><tspan fill="var(--bone)">Merge pull request #18 from Garvnanda/readme-v2</tspan></text>
  <text class="mono row" style="animation-delay:0.40s" x="24" y="212" font-size="13"><tspan fill="var(--accent)">Garvnanda</tspan><tspan fill="var(--dim)"> — </tspan><tspan fill="var(--bone)">fix: attribute one automated commit per day, correct</tspan></text>
