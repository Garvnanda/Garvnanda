<svg viewBox="0 0 1000 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <style>
    :root { --rule: #C0C0C0; }
    @media (prefers-color-scheme: dark) { :root { --rule: #444444; } }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 460; stroke-dashoffset: 460; animation: d 1s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <line class="draw" x1="270" y1="12" x2="730" y2="12"/>
</svg>
