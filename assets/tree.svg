<svg viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live Ecosystem Tree">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #000000; }
    .card { fill: #111111; stroke: #30363D; stroke-width: 1.5; }

    .trunk { stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; }
    .branch { stroke: #E3B341; stroke-width: 2.5; stroke-linecap: round; fill: none; }

    .fruit-pink { fill: #111111; stroke: #FF5F56; stroke-width: 3; }
    .fruit-green { fill: #111111; stroke: #39D353; stroke-width: 3; }
    .fruit-blue { fill: #111111; stroke: #58A6FF; stroke-width: 3; }

    .fruit-group { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; transition: transform .3s; }
    .fruit-group:hover { transform: scale(1.1); cursor: pointer; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .fruit-group { animation: none; } }
  </style>

  <rect width="1000" height="500" class="bg"/>
  <rect x="48" y="20" width="904" height="460" rx="8" class="card"/>

  <text fill="#FFFFFF" class="mono" x="72" y="56" font-size="16" font-weight="800" letter-spacing="1">LIVE ECOSYSTEM TREE 🌳</text>
  <text fill="#8B949E" class="mono" x="928" y="56" font-size="12" font-weight="600" text-anchor="end">REAL-TIME REPOSITORY BRANCHES</text>
  <line x1="72" y1="70" x2="928" y2="70" stroke="#30363D" stroke-width="1"/>

  <g>
    <!-- ground -->
    <path d="M 370 456 Q 500 456 500 440 Q 500 456 630 456" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.35"/>

    <!-- trunk (staggered strokes for bark texture) -->
    <line x1="495" y1="440" x2="495" y2="128" class="trunk"/>
    <line x1="500" y1="440" x2="500" y2="118" class="trunk"/>
    <line x1="505" y1="440" x2="505" y2="128" class="trunk"/>

    <!-- tier 3 (base) branches -->
    <path d="M 500 388 Q 340 388 210 360" class="branch"/>
    <path d="M 500 388 Q 660 388 790 360" class="branch"/>

    <!-- tier 2 (mid) branches -->
    <path d="M 500 300 Q 360 288 250 252" class="branch"/>
    <path d="M 500 300 Q 640 288 750 252" class="branch"/>

    <!-- tier 1 (upper) branches -->
    <path d="M 500 210 Q 400 178 300 150" class="branch"/>
    <path d="M 500 210 Q 600 178 700 150" class="branch"/>

    <!-- trunk to core -->
    <path d="M 500 128 L 500 108" class="branch"/>

    <!-- core node -->
    <g class="fruit-group" style="transform-origin: 500px 108px;">
      <circle cx="500" cy="108" r="15" class="fruit-green"/>
      <rect x="428" y="70" width="144" height="24" rx="4" fill="#161B22" stroke="#39D353" stroke-width="1"/>
      <text x="500" y="86" fill="#39D353" class="mono" font-size="12" font-weight="800" text-anchor="middle">@Garvnanda Core</text>
    </g>

    <!-- tier 1: DEVLENS / DATATHON-2026 -->
    <g class="fruit-group" style="transform-origin: 300px 150px;">
      <circle cx="300" cy="150" r="13" class="fruit-pink"/>
      <rect x="192" y="138" width="108" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="246" y="154" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">DEVLENS</text>
    </g>
    <g class="fruit-group" style="transform-origin: 700px 150px;">
      <circle cx="700" cy="150" r="13" class="fruit-blue"/>
      <rect x="700" y="138" width="134" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="767" y="154" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">DATATHON-2026</text>
    </g>

    <!-- tier 2: GALLA-SAATHI / DEBATEMIND -->
    <g class="fruit-group" style="transform-origin: 250px 252px;">
      <circle cx="250" cy="252" r="13" class="fruit-blue"/>
      <rect x="128" y="240" width="122" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="189" y="256" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">GALLA-SAATHI</text>
    </g>
    <g class="fruit-group" style="transform-origin: 750px 252px;">
      <circle cx="750" cy="252" r="13" class="fruit-pink"/>
      <rect x="750" y="240" width="122" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="811" y="256" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">DEBATEMIND</text>
    </g>

    <!-- tier 3: SANN / CREATOR_X -->
    <g class="fruit-group" style="transform-origin: 210px 360px;">
      <circle cx="210" cy="360" r="13" class="fruit-green"/>
      <rect x="118" y="348" width="92" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="164" y="364" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">SANN</text>
    </g>
    <g class="fruit-group" style="transform-origin: 790px 360px;">
      <circle cx="790" cy="360" r="13" class="fruit-green"/>
      <rect x="790" y="348" width="104" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="842" y="364" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">CREATOR_X</text>
    </g>
  </g>
</svg>
