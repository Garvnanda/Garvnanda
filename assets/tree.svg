<svg viewBox="0 0 1000 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ecosystem Tree">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #000000; }
    .card { fill: #111111; stroke: #30363D; stroke-width: 1.5; }

    .trunk { stroke: #FFFFFF; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .branch-y { stroke: #E3B341; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    .fruit-pink { fill: #111111; stroke: #FF5F56; stroke-width: 3.5; }
    .fruit-green { fill: #111111; stroke: #39D353; stroke-width: 3.5; }
    .fruit-blue { fill: #111111; stroke: #58A6FF; stroke-width: 3.5; }

    .fruit-group { animation: float 4s ease-in-out infinite; transition: transform 0.3s; }
    .fruit-group:hover { transform: scale(1.12); cursor: pointer; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) { .fruit-group { animation: none; } }
  </style>

  <!-- Transparent / Black outer canvas with 540px height -->
  <rect width="1000" height="540" class="bg"/>
  <rect x="48" y="20" width="904" height="500" rx="8" class="card"/>

  <!-- Header Title -->
  <text fill="#FFFFFF" class="mono" x="72" y="56" font-size="16" font-weight="800" letter-spacing="1">LIVE ECOSYSTEM TREE 🌳</text>
  <text fill="#8B949E" class="mono" x="928" y="56" font-size="12" font-weight="600" text-anchor="end">REAL-TIME REPOSITORY BRANCHES</text>
  <line x1="72" y1="70" x2="928" y2="70" stroke="#30363D" stroke-width="1"/>

  <g>
    <!-- ROOT BASE LINE -->
    <path d="M 340 470 Q 500 470 500 430 Q 500 470 660 470" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.4"/>

    <!-- TRUNK LINES (PARALLEL CIRCUIT TRUNKS) -->
    <line x1="492" y1="450" x2="492" y2="260" class="trunk"/>
    <line x1="500" y1="450" x2="500" y2="200" class="trunk"/>
    <line x1="508" y1="450" x2="508" y2="260" class="trunk"/>

    <!-- BRANCHES LEFT -->
    <!-- Low Left Branch -->
    <path d="M 492 410 L 380 410 L 300 370 L 230 370" class="branch-y"/>

    <!-- Mid Left Branch -->
    <path d="M 492 320 L 400 270 L 320 270 L 260 240" class="branch-y"/>

    <!-- High Left Branch -->
    <path d="M 500 240 L 430 180 L 340 180 L 300 150" class="branch-y"/>

    <!-- BRANCHES RIGHT -->
    <!-- Low Right Branch -->
    <path d="M 508 410 L 620 410 L 700 370 L 770 370" class="branch-y"/>

    <!-- Mid Right Branch -->
    <path d="M 508 320 L 600 270 L 680 270 L 740 240" class="branch-y"/>

    <!-- High Right Branch -->
    <path d="M 500 240 L 570 180 L 660 180 L 700 150" class="branch-y"/>

    <!-- TOP CENTER TRUNK FRUIT -->
    <path d="M 500 200 L 500 135" class="branch-y"/>

    <!-- FRUIT NODES & BADGES -->

    <!-- Top Center Core Node -->
    <g class="fruit-group" style="transform-origin: 500px 135px;">
      <circle cx="500" cy="135" r="15" class="fruit-green"/>
      <rect x="430" y="96" width="140" height="24" rx="4" fill="#161B22" stroke="#39D353" stroke-width="1"/>
      <text x="500" y="112" fill="#39D353" class="mono" font-size="12" font-weight="800" text-anchor="middle">@Garvnanda Core</text>
    </g>

    <!-- Node 1: High Left -->
    <g class="fruit-group" style="transform-origin: 300px 150px;">
      <circle cx="300" cy="150" r="14" class="fruit-pink"/>
      <rect x="230" y="138" width="100" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="280" y="154" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">DEVLENS</text>
    </g>

    <!-- Node 2: High Right -->
    <g class="fruit-group" style="transform-origin: 700px 150px;">
      <circle cx="700" cy="150" r="14" class="fruit-blue"/>
      <rect x="715" y="138" width="150" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="790" y="154" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">DATATHON-2026</text>
    </g>

    <!-- Node 3: Mid Left -->
    <g class="fruit-group" style="transform-origin: 260px 240px;">
      <circle cx="260" cy="240" r="14" class="fruit-blue"/>
      <rect x="105" y="228" width="145" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="177" y="244" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">GALLA-SAATHI</text>
    </g>

    <!-- Node 4: Mid Right -->
    <g class="fruit-group" style="transform-origin: 740px 240px;">
      <circle cx="740" cy="240" r="14" class="fruit-pink"/>
      <rect x="755" y="228" width="130" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="820" y="244" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">DEBATEMIND</text>
    </g>

    <!-- Node 5: Low Left -->
    <g class="fruit-group" style="transform-origin: 230px 370px;">
      <circle cx="230" cy="370" r="14" class="fruit-green"/>
      <rect x="175" y="358" width="90" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="220" y="374" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">SANN</text>
    </g>

    <!-- Node 6: Low Right -->
    <g class="fruit-group" style="transform-origin: 770px 370px;">
      <circle cx="770" cy="370" r="14" class="fruit-green"/>
      <rect x="800" y="358" width="115" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="857" y="374" fill="#FFFFFF" class="mono" font-size="11" font-weight="800" text-anchor="middle">CREATOR_X</text>
    </g>
  </g>
</svg>
