<svg viewBox="0 0 1000 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages, backend, ML, data, web, tooling">
  <style>
    :root { --bone: #333333; --rule: #E1E4E8; --muted: #888888; --accent: #555555; --panel: #F8F9FA; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #333333; --muted: #777777; --accent: #AAAAAA; --panel: #161616; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a0{animation-delay:0s} .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <rect x="24" y="8" width="952" height="214" rx="10" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5" class="rise a0"/>
  <line x1="162" y1="30" x2="162" y2="200" stroke="var(--rule)" stroke-width="1" opacity=".7"/>

  <text class="mono rise a1" x="56" y="52"  font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="178" y="52"  font-size="14" fill="var(--bone)">Python · JavaScript · TypeScript · C++ · SQL</text>

  <text class="mono rise a2" x="56" y="84"  font-size="12" fill="var(--muted)" letter-spacing="2">BACKEND</text>
  <text class="mono rise a2" x="178" y="84"  font-size="14" fill="var(--bone)">FastAPI · Flask · Node.js · Express · REST APIs</text>

  <text class="mono rise a3" x="56" y="116"  font-size="12" fill="var(--muted)" letter-spacing="2">ML / AI</text>
  <text class="mono rise a3" x="178" y="116"  font-size="14" fill="var(--bone)">PyTorch · scikit-learn · Transformers · LLM pipelines</text>

  <text class="mono rise a4" x="56" y="148" font-size="12" fill="var(--muted)" letter-spacing="2">DATA</text>
  <text class="mono rise a4" x="178" y="148" font-size="14" fill="var(--bone)">PostgreSQL · MongoDB · Pandas · NumPy</text>

  <text class="mono rise a5" x="56" y="180" font-size="12" fill="var(--muted)" letter-spacing="2">WEB</text>
  <text class="mono rise a5" x="178" y="180" font-size="14" fill="var(--bone)">React · Next.js · Tailwind CSS</text>

  <text class="mono rise a6" x="56" y="204" font-size="11" fill="var(--muted)" letter-spacing="2">TOOLING</text>
  <text class="mono rise a6" x="178" y="204" font-size="13" fill="var(--muted)">Git · Docker · Postman · Vercel</text>
</svg>
