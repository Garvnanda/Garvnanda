<svg viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ecosystem System Map">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect width="1000" height="360" fill="#FFFFFF"/>
  
  <!-- Box 1 -->
  <rect x="48" y="20" width="436" height="150" rx="6" fill="#F8F9FA" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#000000" class="mono" x="72" y="52" font-size="14" font-weight="700" letter-spacing="1">01. MACHINE LEARNING &amp; LLMS</text>
  <line x1="72" y1="64" x2="460" y2="64" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#555555" class="mono" x="72" y="92" font-size="12">• Gemma 4 &amp; LLM Fine-Tuning (LoRA / PEFT)</text>
  <text fill="#555555" class="mono" x="72" y="114" font-size="12">• Speech Recognition (Sarvam ASR &amp; AI4Bharat)</text>
  <text fill="#555555" class="mono" x="72" y="136" font-size="12">• PyTorch, Scikit-Learn &amp; Embeddings</text>

  <!-- Box 2 -->
  <rect x="516" y="20" width="436" height="150" rx="6" fill="#F8F9FA" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#000000" class="mono" x="540" y="52" font-size="14" font-weight="700" letter-spacing="1">02. BACKEND &amp; SYSTEM DESIGN</text>
  <line x1="540" y1="64" x2="928" y2="64" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#555555" class="mono" x="540" y="92" font-size="12">• High-Performance FastAPI Services</text>
  <text fill="#555555" class="mono" x="540" y="114" font-size="12">• Supabase / PostgreSQL &amp; Redis Caching</text>
  <text fill="#555555" class="mono" x="540" y="136" font-size="12">• Containerization &amp; Zoho Catalyst Deployment</text>

  <!-- Box 3 -->
  <rect x="48" y="190" width="436" height="150" rx="6" fill="#F8F9FA" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#000000" class="mono" x="72" y="222" font-size="14" font-weight="700" letter-spacing="1">03. AI SAFETY &amp; NEURAL AUDITING</text>
  <line x1="72" y1="234" x2="460" y2="234" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#555555" class="mono" x="72" y="262" font-size="12">• Model Memorization &amp; Shortcut Detectors</text>
  <text fill="#555555" class="mono" x="72" y="284" font-size="12">• Backdoor Poisoning &amp; Leakage Inspection</text>
  <text fill="#555555" class="mono" x="72" y="306" font-size="12">• Explainable AI &amp; Robustness Benchmarks</text>

  <!-- Box 4 -->
  <rect x="516" y="190" width="436" height="150" rx="6" fill="#F8F9FA" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#000000" class="mono" x="540" y="222" font-size="14" font-weight="700" letter-spacing="1">04. WEB3 &amp; DECENTRALIZED APPS</text>
  <line x1="540" y1="234" x2="928" y2="234" stroke="#E1E4E8" stroke-width="1"/>
  <text fill="#555555" class="mono" x="540" y="262" font-size="12">• Smart Contract Architecture (Solidity)</text>
  <text fill="#555555" class="mono" x="540" y="284" font-size="12">• Decentralized SocialFi Infrastructure</text>
  <text fill="#555555" class="mono" x="540" y="306" font-size="12">• Web3 Backend Integration &amp; Node APIs</text>
</svg>