<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Garv Nanda Cover Banner">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .title { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; font-weight: 900; }
  </style>
  <rect width="1000" height="220" rx="8" fill="#F6F8FA"/>
  
  <!-- Constellation Mesh Network Background -->
  <line x1="80" y1="40" x2="220" y2="90" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="220" y1="90" x2="160" y2="160" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="160" y1="160" x2="300" y2="140" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="300" y1="140" x2="380" y2="60" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="380" y1="60" x2="220" y2="90" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>

  <line x1="620" y1="50" x2="740" y2="120" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="740" y1="120" x2="880" y2="70" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="880" y1="70" x2="820" y2="170" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="820" y1="170" x2="680" y2="150" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="680" y1="150" x2="620" y2="50" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>

  <!-- Nodes -->
  <circle cx="80" cy="40" r="3" fill="#0969DA"/>
  <circle cx="220" cy="90" r="4" fill="#0969DA"/>
  <circle cx="160" cy="160" r="3" fill="#0969DA"/>
  <circle cx="300" cy="140" r="3.5" fill="#0969DA"/>
  <circle cx="380" cy="60" r="3" fill="#0969DA"/>
  
  <circle cx="620" cy="50" r="3" fill="#0969DA"/>
  <circle cx="740" cy="120" r="4" fill="#0969DA"/>
  <circle cx="880" cy="70" r="3" fill="#0969DA"/>
  <circle cx="820" cy="170" r="3.5" fill="#0969DA"/>
  <circle cx="680" cy="150" r="3" fill="#0969DA"/>

  <!-- Main Banner Text -->
  <text fill="#000000" class="title" x="500" y="110" font-size="44" letter-spacing="2" text-anchor="middle">Garv Nanda</text>
  <text fill="#57606A" class="mono" x="500" y="152" font-size="18" font-weight="600" letter-spacing="3" text-anchor="middle">ML &amp; BACKEND ENGINEER</text>
</svg>