<svg viewBox="0 0 1000 240" width="1000" height="240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status">
  <style>
    :root { --bone: #333333; --rule: #E1E4E8; --muted: #888888; --dim: #AAAAAA; --accent: #555555; --panel: #F8F9FA; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #333333; --muted: #777777; --dim: #666666; --accent: #AAAAAA; --panel: #161616; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a0{animation-delay:0s} .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    :root { --bone: #000000; --rule: #000000; --muted: #000000; --dim: #000000; --accent: #000000; --panel: #FFFFFF; }
  </style>

  <rect x="24" y="8" width="952" height="224" rx="10" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5" class="rise a0"/>

  <text class="mono rise a0" x="56" y="42" font-size="12" fill="var(--muted)" letter-spacing="3">ABOUT / SYSTEM DIAGNOSTICS</text>
  <line class="rise a0" x1="56" y1="54" x2="944" y2="54" stroke="var(--rule)" stroke-width="1"/>

  <text class="mono rise a1" x="56" y="86" font-size="15" fill="var(--bone)">&#9656; computer science undergraduate specializing in machine learning.</text>
  <text class="mono rise a2" x="56" y="112" font-size="15" fill="var(--bone)">&#9656; focused on model interpretability, safety, and auditability.</text>
  <text class="mono rise a3" x="56" y="138" font-size="14" fill="var(--muted)">&#9656; 7+ AI/ML and Web3 projects shipped end-to-end &#8212; training through deployment.</text>

  <line class="rise a4" x1="56" y1="160" x2="944" y2="160" stroke="var(--rule)" stroke-width="1" opacity=".6"/>

  <text class="mono rise a4" x="56"  y="192" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="162" y="192" font-size="14" fill="var(--bone)">Model Interpretability &amp; Auditing &#183; RAG &#183; PyTorch &#183; Agent Safety</text>

  <text class="mono rise a5" x="56"  y="216" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="162" y="216" font-size="14" fill="var(--accent)">open to internships &#183; freelance &#183; collaboration</text>
</svg>
